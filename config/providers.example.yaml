asr:
  provider: mock
  supported: [mock, doubao]
  credential_env: DOUBAO_ASR_KEY

tts:
  provider: mock
  supported: [mock, doubao]
  voice_id: default
  credential_env:
    app_id: DOUBAO_TTS_APP_ID
    access_token: DOUBAO_TTS_ACCESS_TOKEN
    voice_type: DOUBAO_TTS_VOICE_TYPE

llm:
  provider: mock
  supported: [mock, doubao_ark, openai_compatible]
  temperature: 0.2
  max_output_characters: 180
  credential_env:
    doubao_ark: ARK_API_KEY
    openai_compatible: OPENAI_COMPATIBLE_API_KEY

embedding:
  provider: mock
  supported: [mock, doubao_ark, openai_compatible]
  dimensions: null
  credential_env: EMBEDDING_API_KEY

knowledge:
  provider: sqlite_faiss_lightweight_rag
  db_path: var/knowledge/knowledge.sqlite3
  faiss_index_path: var/knowledge/faiss.index
  source_formats: [md, txt, pdf, docx]
  fallback_to_llm: true
  require_human_when_uncertain: true
  allowed_status_for_customer_answer: approved
