services:
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: jiyangjia-gateway
    restart: unless-stopped
    env_file:
      - ../secrets/.env.local
    environment:
      - TZ=Asia/Shanghai
      - APP_NAME=jiyangjia-gateway
      - APP_VERSION=0.1.0
      - JIYANGJIA_KNOWLEDGE_DB_PATH=/app/var/knowledge/jiyangjia.db
      - JIYANGJIA_KNOWLEDGE_FAISS_PATH=/app/var/knowledge/faiss.index
      - JIYANGJIA_ADMIN_DB_PATH=/app/var/admin/admin.db
      - JIYANGJIA_ADMIN_UPLOAD_DIR=/app/var/knowledge/uploads
      - JIYANGJIA_ASSET_DIR=/app/var/assets
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ../gateway/app:/app/app:ro
      - ../gateway/logs:/app/logs
      - ../var/knowledge:/app/var/knowledge
      - ../var/admin:/app/var/admin
      - ../var/assets:/app/var/assets
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - gateway-network

networks:
  gateway-network:
    name: jiyangjia-gateway-network
