client_max_body_size 8m;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

location = /health {
    proxy_pass http://127.0.0.1:8080/health;
}

location = /admin {
    return 302 /admin/system;
}

location = /admin/ {
    return 302 /admin/system;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8080;
}

location = /api/v1/admin/knowledge/upload {
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8080;
}

location = /api/v1/admin/avatar {
    client_max_body_size 260m;
    proxy_pass http://127.0.0.1:8080;
}

location /api/ {
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8080;
}

location = /downloads/jiyangjia-ai-demo.apk {
    alias /var/www/jiyangjia/downloads/jiyangjia-ai-demo.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="jiyangjia-ai-demo.apk"' always;
}

location /downloads/ {
    alias /var/www/jiyangjia/downloads/;
    autoindex off;
}

location / {
    default_type text/plain;
    return 200 "jiyangjia gateway ready\n";
}
