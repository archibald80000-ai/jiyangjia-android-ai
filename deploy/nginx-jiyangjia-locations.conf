client_max_body_size 8m;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
add_header Permissions-Policy "microphone=(self)" always;

location = /health {
    proxy_pass http://127.0.0.1:8080/health;
}

location = / {
    proxy_pass http://127.0.0.1:8080/demo/public;
}

location = /demo {
    return 302 /demo/kiosk;
}

location /demo/ {
    proxy_pass http://127.0.0.1:8080;
}

location = /admin {
    return 302 /admin/system;
}

location = /admin/ {
    return 302 /admin/system;
}

location /admin/ {
    proxy_pass http://127.0.0.1:8080;
}

location = /api/v1/admin/knowledge/upload {
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8080;
}

location = /api/v1/admin/avatar {
    client_max_body_size 260m;
    proxy_pass http://127.0.0.1:8080;
}

location /api/ {
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8080;
}

location /access/ {
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8080;
}

location = /downloads/jiyangjia-ai-demo.apk {
    alias /var/www/jiyangjia/downloads/jiyangjia-ai-demo.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment; filename=\"jiyangjia-ai-phone-demo-v0.1.8.apk\"; filename*=UTF-8''%E7%A7%AF%E5%85%BB%E5%AE%B6AI%E6%95%B0%E5%AD%97%E4%BA%BA-%E6%89%8B%E6%9C%BA%E4%BD%93%E9%AA%8C%E7%89%88-v0.1.8.apk" always;
}

location = /downloads/jiyangjia-ai-digital-human.apk {
    alias /var/www/jiyangjia/downloads/jiyangjia-ai-demo.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment; filename=\"jiyangjia-ai-phone-demo-v0.1.8.apk\"; filename*=UTF-8''%E7%A7%AF%E5%85%BB%E5%AE%B6AI%E6%95%B0%E5%AD%97%E4%BA%BA-%E6%89%8B%E6%9C%BA%E4%BD%93%E9%AA%8C%E7%89%88-v0.1.8.apk" always;
}

location = /downloads/jiyangjia-ai-store-kiosk.apk {
    alias /var/www/jiyangjia/downloads/jiyangjia-ai-store-kiosk.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment; filename=\"jiyangjia-ai-store-kiosk.apk\"; filename*=UTF-8''%E7%A7%AF%E5%85%BB%E5%AE%B6AI%E6%95%B0%E5%AD%97%E4%BA%BA-%E9%97%A8%E5%BA%97%E5%A4%A7%E5%B1%8F%E7%89%88-v0.1.8.apk" always;
}

location /downloads/ {
    alias /var/www/jiyangjia/downloads/;
    autoindex off;
}

location / {
    return 404;
}
