map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai-jiyangjia.cloud 120.53.86.89;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://ai-jiyangjia.cloud$request_uri;
    }
}

# Temporary IP certificate endpoint retained only for rollback diagnostics.
# Android and production documentation must use ai-jiyangjia.cloud.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 120.53.86.89;

    ssl_certificate /etc/letsencrypt/live/120.53.86.89/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/120.53.86.89/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/jiyangjia-gateway-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai-jiyangjia.cloud;

    ssl_certificate /etc/letsencrypt/live/ai-jiyangjia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-jiyangjia.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/snippets/jiyangjia-gateway-locations.conf;
}
