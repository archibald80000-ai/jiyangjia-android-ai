name: Feature proposal
about: Propose a feature with product value and scope
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals and risks
